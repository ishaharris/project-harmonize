protocol_version: '2-openfold2-templates'
models:
  openfold2:
    provider: nvidia_openfold2
    version: "NVIDIA OpenFold2; AF2 weights 2.3.2 per model card; deployed build unavailable"
    samples: ['1', '2', '3', '4', '5']
    settings:
      relax_prediction: false
      use_templates: true
      preparation:
        msa:
          databases: [all]
          search_type: colabfold
          e_value: 0.0001
          output_alignment_formats: [a3m]
        templates:
          evalue_cutoff: 0.0001
          min_identity: 0.9
          min_query_coverage: 0.7
          min_backbone_coverage: 0.7
          max_candidates: 20
          max_templates: 4
  esmfold:
    provider: esmatlas
    version: esmfold_v1
    samples: ['1']
    settings: {}
  esmfold2:
    provider: biohub
    version: esmfold2-2026-05
    samples: ['1', '2', '3', '4', '5']
    settings:
      num_loops: 20
      num_sampling_steps: 100
      include_pae: true
      lm_dropout: 0.3
      lm_mask_pct: 0.0
      msa_max_depth: 1024
      msa_column_mask_rate: 0.1
      include_embeddings: false
      include_distogram: false
