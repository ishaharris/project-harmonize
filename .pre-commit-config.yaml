repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff check
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen ruff format --check
        language: system
        types_or: [python, jupyter]
      - id: nbstripout
        name: Strip notebook outputs
        entry: uv run --frozen nbstripout
        language: system
        types: [jupyter]
